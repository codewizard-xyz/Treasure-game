<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="treasure.css" rel="stylesheet" type="text/css">
    <title>Find the buried treasure!</title>
</head>
<body>
    <h1 id="heading">Find the buried treasure!</h1>

    <img id="map" width=700 height=700 src="http://nostarch.com/images/treasuremap.png">

    

    <table>
        <tr>
            <td><p id="distance"></p></td>
            <td><p id="score"></p></td>
        </tr>
    </table>

    <script src="https://code.jquery.com/jquery-2.1.0.js"></script>

    <script>
        //Отримуємо випадкове число від 0 до size
        var getRandomNumber = function(size) {
            return Math.floor(Math.random() * size);
        };

        //Враховуємо відстань між подією та ціллю
        var getDistance = function(event, target) {
                var diffX = event.offsetX - target.x;
                var diffY = event.offsetY - target.y;
                return Math.sqrt((diffX * diffX) + (diffY * diffY));
        };

        //Отримуємо рядок, що показує відстань
        var getDistanceHint = function (distance) {
            if (distance < 10) {
                return "Boiling hot";
            } else if (distance < 20) {
                return "Really hot";
            } else if (distance < 40) {
                return "Hot";
            } else if (distance < 80) {
                return "Warm";
            } else if (distance < 160) {
                return "Cold";
            } else if (distance < 320) {
                return "Really cold";
            } else if (distance < 640) {
                return "Really really cold";
            } else {
                return "Freezing!";
            }
        };

        //Змінні параметри
        var width = 700;
        var height = 700;
        var clicks = 20;

        //Створюємо випадкову локацію target
        var target = {
            x: getRandomNumber(width),
            y: getRandomNumber(height)
        };

        console.log(target);

        //Додаємо маніпулятор кліків до елемента img
        $("#map").click(function(event) {
            clicks--;

            //Отримуємо відстань між event i target
            var distance = getDistance(event, target);

            //Конвертуємо відстань у підсказку
            var distanceHint = getDistanceHint(distance);

            //Оновлюємо #distance-елемент новою підказкою
            $("#distance").text(distanceHint);

            $("#score").text("Clicks left: " + clicks);

            if (distance < 8) {
                alert("Found the treasure in " + clicks + " clicks!");
            }

            if (clicks < 1) {
                alert("GAME OVER!");
            }
        });        
    </script>
</body>
</html>
